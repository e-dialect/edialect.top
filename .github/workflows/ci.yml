name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safety:
    name: Release safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_check_runtime.py'
  image:
    name: Static image and routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: edialect-homepage:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=homepage
          cache-to: type=gha,mode=max,scope=homepage
      - name: Check real Nginx image and every route chunk
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/check-runtime.py --image edialect-homepage:ci --source-sha "$SOURCE_SHA"
  ci-gate:
    name: CI gate
    if: always()
    needs: [release-safety, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          for (const [name, job] of Object.entries(JSON.parse(process.env.NEEDS))) {
            if (job.result !== 'success') throw new Error(`${name}: ${job.result}`);
          }
          JS
